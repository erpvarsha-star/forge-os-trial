name: Bug Report
description: Report something broken in Forge OS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Tap on...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role / screen affected
      description: Which role group was the app showing when this happened?
      options:
        - owner
        - plant_head
        - hr_admin
        - manager
        - supervisor
        - security_guard
        - member
        - Not role-specific / unsure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version (apk number)
      description: "e.g. apk-128 — check More → Download Latest App"
      placeholder: apk-128
    validations:
      required: false

  - type: checkboxes
    id: payroll-related
    attributes:
      label: Payroll-related
      description: Does this bug involve pay runs, salary, bank details, warnings, or any payroll screen? Payroll bugs need extra care per this project's rules.
      options:
        - label: This is payroll-related
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, employee/emp_code (if relevant), or anything else useful.
    validations:
      required: false
