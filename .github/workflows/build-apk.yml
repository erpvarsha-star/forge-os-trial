name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/forge-os-backend-setup-7woj4t
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app.json'
      - 'eas.json'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'hooks/**'
      - 'i18n/**'
      - 'lib/**'
      - 'types/**'
      - 'babel.config.js'
      - 'tailwind.config.js'
      - 'tsconfig.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # EXPO_PUBLIC_* vars are inlined into the JS bundle at build time by
      # Metro (during the Gradle bundleRelease task), not read at runtime —
      # without these, supabase-js's createClient() throws on the
      # non-null-asserted undefined URL/key (lib/supabase.ts) and the app
      # crashes immediately on launch, before any screen renders.
      # The URL is not a secret (it's already documented in CLAUDE.md and is
      # meant to be public); the anon key is protected by RLS and is also
      # meant to ship inside the client bundle, but per repo policy
      # (CLAUDE.md: "All secrets via environment variables — never
      # hardcoded") it's sourced from a GitHub Actions secret rather than
      # inlined here.
      EXPO_PUBLIC_SUPABASE_URL: https://odfwtdpvpfzdrznvurru.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Cosmetic, not secret (see lib/config.ts fallbacks) — without this the
      # login screen shows the literal fallback string "Your Company"
      # instead of the real company name.
      EXPO_PUBLIC_COMPANY_NAME: Varsha Forgings Pvt Ltd
      # Factory OS operations dashboard, opened in-browser from the home screen
      # by staff/board only (components/FactoryOsLink.tsx gates on
      # employees.category). Not a secret — it is a URL compiled into the APK.
      # If empty the button hides itself rather than shipping a dead link, so
      # an unset value is safe.
      EXPO_PUBLIC_FACTORY_OS_URL: https://erpvarsha-star.github.io/vfpl-dashboard-26-27/
      # Confirmed spelling matches CLAUDE.md's header and .env exactly.
    steps:
      - uses: actions/checkout@v4

      - name: Verify Supabase secret is configured
        # A missing secret resolves to an empty string here, not a workflow
        # error — the Gradle build would still exit 0 and produce an APK,
        # just one that crashes on launch (the exact bug this workflow
        # change fixes). Fail loudly instead of shipping that silently.
        # Confirmed this guard actually fires on a real missing secret:
        # run 31447167307 failed here in 18s before the secret was added.
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY repo secret is not set (Settings > Secrets and variables > Actions > New repository secret). Value = the anon/publishable key for Supabase project odfwtdpvpfzdrznvurru (dashboard > Settings > API). Without it the APK builds successfully but crashes on launch."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: react-native-screens@3.31.0 ships a broken
        # postinstall ("bob build && husky install") meant only for its own
        # repo's dev workflow; `bob` isn't a dependency here so it exits 127.
        # None of the packages this project actually uses need install
        # scripts to run (checked: react-native, expo, expo-router,
        # reanimated have none).
        run: npm ci --ignore-scripts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp build number into app.json
        # UpdateBanner compares the installed versionCode against the numeric
        # part of the latest GitHub release tag (apk-<run number>). Both must
        # come from the same counter or the banner either never fires or fires
        # on every launch. Done before prebuild so it lands in the manifest.
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('versionCode set to', app.expo.android.versionCode);
          "
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Pin Gradle wrapper to the version react-native's own template ships
        # expo prebuild writes gradle-wrapper.properties pointing at Gradle 8.8,
        # but @react-native/gradle-plugin locks Android Gradle Plugin to 8.2.1
        # (see node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml),
        # and AGP 8.2.1 is incompatible with Gradle 8.8 — fails with "Could not
        # get unknown property 'release' for SoftwareComponent container" and
        # "Plugin [id: 'expo-module-gradle-plugin'] was not found". React
        # Native's own template (node_modules/react-native/template/android/
        # gradle/wrapper/gradle-wrapper.properties) pins Gradle 8.6 for this
        # exact AGP version — use that instead of what prebuild generates.
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.6-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-keystore signed, standalone)
        # NOT assembleDebug: React Native's gradle plugin only creates the JS
        # bundling task for non-debuggable variants (see
        # node_modules/@react-native/gradle-plugin/.../TaskConfiguration.kt:
        # "if (!isDebuggableVariant) { ...create bundle task... }"). A debug
        # APK ships with no embedded JS at all and requires a Metro dev
        # server on the same network — useless for sideloading to phones
        # that aren't connected to one. The generated android/app/build.gradle
        # signs `release` with the debug keystore by default (standard Expo/RN
        # template), so assembleRelease produces a fully standalone,
        # installable APK with zero extra keystore setup.
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK (workflow artifact, 14-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        # Uploads straight from the runner (full internet access) so nobody
        # has to manually download-then-reupload a large binary through a
        # network-restricted agent sandbox or a chat upload limit. The
        # "latest" release + fixed filename means
        # /releases/latest/download/app-release.apk is a permanent URL that
        # always points at the most recent successful build.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Forge OS APK (build ${{ github.run_number }})
          make_latest: true
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            Debug-keystore-signed release APK for direct sideload install (not distributed via Play Store).
            Built from commit ${{ github.sha }}.

            Permanent download link (always the latest build): https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk
