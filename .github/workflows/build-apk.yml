name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/forge-os-backend-setup-7woj4t
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app.json'
      - 'eas.json'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: react-native-screens@3.31.0 ships a broken
        # postinstall ("bob build && husky install") meant only for its own
        # repo's dev workflow; `bob` isn't a dependency here so it exits 127.
        # None of the packages this project actually uses need install
        # scripts to run (checked: react-native, expo, expo-router,
        # reanimated have none).
        run: npm ci --ignore-scripts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
