name: Deploy Dashboard

# Deploys dashboard/index.html to the forge-os-review Netlify site on every
# push that touches it. Runs on GitHub's own runners, not this project's
# agent sandbox -- the sandbox's network policy blocks all netlify.app
# traffic outright (confirmed via the proxy's own 403 on HTTP tunneling,
# 8 Oct 2026), so every deploy attempted from inside a Claude session fails
# no matter how it's shaped. GitHub Actions has no such restriction, same
# as build-apk.yml and deploy-functions.yml already rely on.
#
# `netlify deploy --build --prod` (not a plain file upload) so Netlify's own
# build step runs netlify.toml's command, which substitutes the real
# Apps Script URL in for the __APPS_SCRIPT_URL__ placeholder using the
# APPS_SCRIPT_URL environment variable already set on the Netlify site
# itself (Site/Project > Environment variables) -- nothing to configure
# here for that part.

on:
  push:
    branches:
      - claude/forge-os-backend-setup-7woj4t
      - main
    paths:
      - 'dashboard/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy dashboard to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Not a secret -- an opaque project ID, same treatment as the
          # Supabase project ref already committed in plain text elsewhere
          # in this repo.
          NETLIFY_SITE_ID: c798623a-6d59-48cc-b98f-486fa7a2ff8d
        run: netlify deploy --build --prod
